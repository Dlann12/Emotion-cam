services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: wajah_emosi_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - YOLO_MODEL_PATH=models/best.pt
    volumes:
      - ./ml-service/models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wajah_emosi_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=production-secret-change-in-env
      - ML_SERVICE_URL=http://ml-service:8000
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/prisma:/app/prisma
    depends_on:
      - ml-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wajah_emosi_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
